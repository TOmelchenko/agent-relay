name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (starter suite + PostgreSQL integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_relay
          POSTGRES_PASSWORD: agent_relay
          POSTGRES_DB: agent_relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agent_relay -d agent_relay"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked

      # test_agent_relay.py defaults RELAY_DATABASE_URL to a scratch SQLite
      # file (see its own os.environ.setdefault) whenever it isn't already
      # set, so this is the starter's original SQLite-backed suite.
      - name: Run the starter's tests (SQLite)
        run: uv run pytest test_agent_relay.py -v

      # test_integration_live.py talks to a real running server over HTTP
      # (SPEC.md acceptance scenario 1), so start one here backed by the
      # Postgres service container above.
      - name: Start Agent Relay against PostgreSQL
        env:
          RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@localhost:5432/agent_relay
        run: |
          uv run uvicorn main:app --host 0.0.0.0 --port 8000 &
          echo $! > /tmp/agent-relay-server.pid

      - name: Wait for the server to report ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/ready >/dev/null; then
              echo "Server is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Server never became ready" >&2
          exit 1

      - name: Run the integration test against PostgreSQL
        env:
          RELAY_TEST_BASE_URL: http://127.0.0.1:8000
        run: uv run pytest test_integration_live.py -v

      - name: Stop the server
        if: always()
        run: kill "$(cat /tmp/agent-relay-server.pid)" 2>/dev/null || true

  build-and-deploy:
    name: Build image and deploy to kind
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Unique per run so the Deployment's pod template actually changes and
      # a rollout has something to do -- reusing a fixed tag like ":local"
      # would make `kubectl set image` a no-op and `rollout status` return
      # instantly without ever re-pulling anything.
      - name: Compute a unique image tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD 2>/dev/null || echo local)-$(date +%s)" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build -t agent-relay:$IMAGE_TAG .

      # Real CI has no kind/kubectl preinstalled and no cluster of its own,
      # so helm/kind-action provisions both, plus a disposable cluster.
      # Under `act` (ACT=true is set automatically), skip that and reuse
      # whatever kind cluster already exists on the host running act --
      # that's the entire point of testing with act instead of a hosted
      # runner: it can actually reach the developer's local Docker/kind.
      - name: Create kind cluster
        if: ${{ !env.ACT }}
        uses: helm/kind-action@v1
        with:
          cluster_name: agent-relay
          wait: 60s

      # Under act, this is talking to whatever kind cluster already exists
      # on the host running act. The kind CLI's `load docker-image` reads
      # the node's containerd config, whose format is tied to the kind
      # version that created the cluster -- so this must stay in step with
      # the locally installed `kind` version (`kind version` on the host),
      # not just "latest".
      - name: Ensure kind and kubectl are available
        if: ${{ env.ACT }}
        run: |
          if ! command -v kubectl >/dev/null; then
            curl -Lo /usr/local/bin/kubectl "https://dl.k8s.io/release/$(curl -Ls https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x /usr/local/bin/kubectl
          fi
          if ! command -v kind >/dev/null; then
            curl -Lo /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64"
            chmod +x /usr/local/bin/kind
          fi
          kubectl config use-context kind-agent-relay
          kubectl cluster-info

      - name: Load image into kind
        run: kind load docker-image agent-relay:$IMAGE_TAG --name agent-relay

      - name: Deploy manifests
        run: kubectl apply -f k8s/

      - name: Wait for PostgreSQL to be ready
        run: kubectl wait --for=condition=ready pod -l app=postgres --timeout=120s

      - name: Roll out the new image
        run: |
          kubectl set image deployment/agent-relay agent-relay=agent-relay:$IMAGE_TAG
          kubectl rollout status deployment/agent-relay --timeout=180s

      - name: Smoke test the deployment
        run: |
          kubectl port-forward svc/agent-relay 8000:8000 &
          pf_pid=$!
          sleep 5
          curl -sf http://127.0.0.1:8000/health
          curl -sf http://127.0.0.1:8000/ready
          kill "$pf_pid" 2>/dev/null || true

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl logs -l app=agent-relay --tail=200 || true
          kubectl logs -l app=postgres --tail=200 || true
